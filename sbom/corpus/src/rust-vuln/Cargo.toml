[package]
name = "rust-vuln"
version = "0.1.0"
edition = "2021"

# regex 1.5.4: RUSTSEC-2022-0013 / CVE-2022-24713
[dependencies]
regex = { version = "=1.5.4", default-features = false, features = ["std"] }

[build-dependencies]
autocfg = "=1.1.0"

[dev-dependencies]
itoa = "=1.0.11"

[profile.release]
strip = "symbols"
